name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Requirement anchors resolve into the submodules.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@v10.2.0  # no floating major tag past v7

      - name: Export HTML
        run: uv run strictdoc export .

      # Only the bare site root: the nav links to the tree as index.html.
      - name: Redirect the site root to the README
        run: |
          readme="$(basename "$PWD")/README.html"
          sed -i "s#<head>#<head><script>if (location.pathname.endsWith('/')) location.replace('$readme');</script>#" \
            output/html/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: output/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
